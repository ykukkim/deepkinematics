name: deepkinematics
channels:
  - conda-forge
dependencies:
  # AITViewer 1.14 supports Python 3.10-3.12. Python 3.11 is a conservative
  # choice for the scientific stack and for loading the existing checkpoints.
  - python=3.11
  - pip>=24
  - setuptools>=70
  - wheel>=0.43
  - pip:
      # Model training and checkpoint evaluation
      - torch>=2.4,<3
      - torchvision>=0.19,<1
      - torchaudio>=2.4,<3
      - torchmetrics>=1.2,<2
      - transformers>=4.44,<6
      - wandb>=0.16,<1
      - roma>=1.5,<2

      # Numerical analysis and manuscript outputs
      - numpy>=1.26,<3
      - scipy>=1.11,<2
      - pandas>=2.2,<3
      - matplotlib>=3.8,<4
      - scikit-learn>=1.4,<2
      - h5py>=3.10,<4
      - mat73>=0.65,<1
      - spm1d==0.4.31
      - openpyxl>=3.1,<4
      - tabulate>=0.9,<1

      # Motion-capture conversion and interactive visualisation
      - ezc3d>=1.5,<2
      - opencv-contrib-python-headless>=4.10,<5
      - aitviewer[pyqt5]>=1.14,<2

      # Lightweight project checks
      - pytest>=8,<10
      - ruff>=0.12,<1
